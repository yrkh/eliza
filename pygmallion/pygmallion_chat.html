<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pygmallion Chat</title>
  <!-- Simple styles to mimic iPhone-like chat bubbles -->
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --bubble-me: #0b93f6;
      --bubble-me-text: #fff;
      --bubble-bot: #e5e5ea;
      --bubble-bot-text: #000;
      --accent: #007aff;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial,
        sans-serif;
      color: #111;
    }
    .app {
      display: flex;
      height: 100%;
      width: 100%;
      align-items: stretch;
      justify-content: center;
    }
    .phone {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: min(780px, 100%);
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #eaeaea;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .transcript {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: var(--bg);
    }
    .row {
      display: flex;
      margin: 10px 0;
    }
    .row.me {
      justify-content: flex-end;
    }
    .row.bot {
      justify-content: flex-start;
    }
    .bubble {
      max-width: 70%;
      padding: 10px 12px;
      border-radius: 18px;
      line-height: 1.3;
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .me .bubble {
      background: var(--bubble-me);
      color: var(--bubble-me-text);
      border-bottom-right-radius: 6px;
    }
    .bot .bubble {
      background: var(--bubble-bot);
      color: var(--bubble-bot-text);
      border-bottom-left-radius: 6px;
    }
    .meta {
      font-size: 12px;
      opacity: 0.65;
      margin-top: 4px;
    }
    .composer {
      border-top: 1px solid #eaeaea;
      padding: 10px 12px;
      background: #fff;
    }
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .choices button {
      background: #fff;
      border: 1px solid #e0e0e0;
      color: #111;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .choices button:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,122,255,0.15);
    }
    .state-pill {
      display: inline-block;
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #e0f2fe;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin-left: 8px;
    }
    .empty {
      text-align: center;
      opacity: .6;
      margin: 24px 0;
    }
  </style>
  <!-- React and Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Simple CommonJS shim so we can use existing files without modification -->
  <script>
    (function () {
      window.__modules = {};
      window.require = function (p) {
        if (p === './jf_talk') return window.__modules['./jf_talk'];
        throw new Error('Unsupported require path: ' + p);
      };
      // module is reset before each load we care about
      window.module = { exports: {} };
    })();
  </script>
  <!-- Load original FSM config and engine (unmodified files) -->
  <script src="./jf_talk.js"></script>
  <script>
    // capture jf_talk exports
    window.__modules['./jf_talk'] = window.module.exports;
    // reset for next module load
    window.module = { exports: {} };
  </script>
  <script src="./jf_pygmallion.js"></script>
  <script>
    // expose engine
    window.jfPygmallion = window.module.exports;
  </script>
</head>
<body>
  <div id="root" class="app"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    // Access state definitions and engine from shims
    const fsmDefinitions = window.__modules['./jf_talk'];
    const { xInitializeUser, xProcessInput } = window.jfPygmallion;

    // Broadcast channel to emit input/output events for external consoles
    const bc = (() => {
      try { return new BroadcastChannel('pygmallion-events'); }
      catch (e) { return { postMessage: () => {} }; }
    })();

    function findState(stateId) {
      return fsmDefinitions.find(s => s.m_stateId === stateId) || null;
    }

    function getTransitions(stateId) {
      const s = findState(stateId);
      if (!s || !s.m_transitions) return {};
      return s.m_transitions;
    }

    function formatTime(d = new Date()) {
      const hrs = d.getHours().toString().padStart(2, '0');
      const mins = d.getMinutes().toString().padStart(2, '0');
      return `${hrs}:${mins}`;
    }

    function ChatApp() {
      const userId = 'ui';
      const [currentState, setCurrentState] = useState('W');
      const [messages, setMessages] = useState([]);
      const scrollerRef = useRef(null);

      useEffect(() => {
        // Initialize FSM for this user only once.
        try { xInitializeUser(userId); } catch (e) {}
        // Seed a welcome message
        setMessages([{
          from: 'bot',
          text: 'Welcome! Choose a transition to proceed.',
          meta: 'state W',
          time: formatTime()
        }]);
      }, []);

      useEffect(() => {
        // Auto scroll to bottom on new messages
        const el = scrollerRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [messages]);

      const transitions = useMemo(() => getTransitions(currentState), [currentState]);

      function onChoose(key) {
        // Add user message (what they selected)
        const newMsgs = [{
          from: 'me',
          text: `Input: ${key}`,
          meta: `from state ${currentState}`,
          time: formatTime()
        }];

        // Emit input event with the transition's m_resultId (if known)
        const selectedTransition = transitions[key];
        if (selectedTransition) {
          bc.postMessage({
            type: 'input',
            resultId: selectedTransition.m_resultId,
            key,
            fromState: currentState,
            at: Date.now()
          });
        }

        try {
          const result = xProcessInput(userId, key);

          // Emit output event with resultId from engine
          bc.postMessage({
            type: 'output',
            resultId: result.resultId,
            action: result.action,
            toState: result.nextState,
            at: Date.now()
          });

          // Add bot response with action and next state
          newMsgs.push({
            from: 'bot',
            text: result.action,
            meta: `→ ${result.nextState} (${result.resultId})`,
            time: formatTime()
          });
          setCurrentState(result.nextState);
        } catch (err) {
          newMsgs.push({
            from: 'bot',
            text: 'Invalid input for the current state.',
            meta: 'error',
            time: formatTime()
          });
        }

        setMessages(prev => [...prev, ...newMsgs]);
      }

      const keys = Object.keys(transitions);

      return (
        <div className="phone">
          <header>
            <div>
              Pygmallion Chat
              <span className="state-pill">State: {currentState}</span>
            </div>
            <button
              onClick={() => {
                // Soft reset UI state only; engine already starts at W for this user
                setCurrentState('W');
                setMessages([{
                  from: 'bot',
                  text: 'Session reset. You are back at state W.',
                  meta: 'reset',
                  time: formatTime()
                }]);
                try { xInitializeUser(userId); } catch (e) {}
              }}
              style={{
                background: 'transparent',
                border: '1px solid #e0e0e0',
                padding: '6px 10px',
                borderRadius: 8,
                cursor: 'pointer'
              }}
            >Reset</button>
          </header>

          <div ref={scrollerRef} className="transcript">
            {messages.length === 0 ? (
              <div className="empty">No messages yet</div>
            ) : (
              messages.map((m, i) => (
                <div key={i} className={`row ${m.from}`}>
                  <div>
                    <div className="bubble">{m.text}</div>
                    <div className="meta">{m.time} • {m.meta}</div>
                  </div>
                </div>
              ))
            )}
          </div>

          <div className="composer">
            <div className="meta" style={{marginBottom: 8}}>Available inputs for state {currentState}:</div>
            <div className="choices">
              {keys.length === 0 ? (
                <span className="meta">No transitions from this state.</span>
              ) : (
                keys.map(k => (
                  <button key={k} onClick={() => onChoose(k)}>{k}</button>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ChatApp />);
  </script>
</body>
</html>
