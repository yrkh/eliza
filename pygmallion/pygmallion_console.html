<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pygmallion Console</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22d3ee;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .wrap {
      display: flex; flex-direction: column; height: 100vh; width: 100%;
    }
    header {
      padding: 10px 14px; background: var(--panel); border-bottom: 1px solid rgba(148,163,184,0.15);
      display: flex; align-items: center; justify-content: space-between;
    }
    header .title { font-weight: 600; }
    header .hint { font-size: 12px; color: var(--muted); }
    .log {
      flex: 1; overflow-y: auto; padding: 12px 14px; white-space: pre-wrap;
    }
    .line { padding: 2px 0; }
    .line .tag { color: var(--accent); }
    .muted { color: var(--muted); }
    footer { padding: 8px 14px; border-top: 1px solid rgba(148,163,184,0.15); color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Pygmallion Console</div>
      <div class="hint">Open pygmallion_chat.html in another tab/window and click transitions.</div>
    </header>
    <div id="log" class="log"></div>
    <footer>Listening on BroadcastChannel "pygmallion-events"</footer>
  </div>

  <script>
    (function(){
      var logEl = document.getElementById('log');

      // Append a full input/output pair wrapped in curly braces, followed by two line breaks
      function appendPair(inputId, outputId){
        var span = document.createElement('span');
        span.textContent = '{ input: ' + inputId + ', output: ' + outputId + ' }';
        logEl.appendChild(span);
        logEl.appendChild(document.createElement('br'));
        logEl.appendChild(document.createElement('br'));
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Fallback append for status/errors
      function appendStatus(text){
        var div = document.createElement('div');
        div.className = 'line';
        div.textContent = text;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      var bc;
      try {
        bc = new BroadcastChannel('pygmallion-events');
      } catch (err) {
        appendStatus('[error] BroadcastChannel not supported in this browser.');
        return;
      }

      appendStatus('Console ready. Waiting for events...');

      // Maintain pending input to pair with next output, if any
      var pendingInput = null;

      bc.onmessage = function(e){
        if (!e || !e.data || !e.data.type) return;
        var d = e.data;
        if (d.type === 'input' && d.resultId){
          // If there was a previous unpaired input, flush it with output '-'
          if (pendingInput !== null) {
            appendPair(pendingInput, '-');
          }
          pendingInput = d.resultId;
          return;
        }
        if (d.type === 'output' && d.resultId){
          if (pendingInput !== null){
            appendPair(pendingInput, d.resultId);
            pendingInput = null;
          } else {
            // Output without a matching input
            appendPair('-', d.resultId);
          }
        }
      };
    })();
  </script>
</body>
</html>
